name: Compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install --only-binary=:all: -r requirements-common.txt
      - run: python -B -X utf8 -m unittest discover -s tests -v
      - run: python -B -X utf8 scripts/setup_environment.py --profile common --state-dir .test-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.python }}
          path: .test-runtime/runtime-common.json
